# Self-hosted deployment behind a host reverse proxy (nginx), without Dokploy.
#   docker compose -f docker-compose.server.yml up -d --build
# Variables come from a .env file next to this file (see docker.env.example).
services:
  openinary:
    image: utegsk/openinary:${IMAGE_TAG:-latest}
    # Always built from this fork - never pulled from Docker Hub
    pull_policy: build
    build:
      context: .
      dockerfile: docker/full.Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        IMAGE_TAG: ${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Only reachable from the host: nginx proxies the public domain to it
    ports:
      - "127.0.0.1:${OPENINARY_PORT:-3000}:3000"
    volumes:
      - cache-data:/app/apps/api/cache
      - public-files:/app/apps/api/public
      - db-data:/app/data
      - db-data:/app/web-standalone/data
    environment:
      - NODE_ENV=production
      - MODE=fullstack
      - NEXT_PUBLIC_API_BASE_URL=/api
      # Required. openssl rand -base64 32
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      # Required. Public https URL served by nginx, e.g. https://media.example.com
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      - BETTER_AUTH_INTERNAL_URL=${BETTER_AUTH_INTERNAL_URL:-http://127.0.0.1:3001}
      # Required. openssl rand -hex 32
      - API_SECRET=${API_SECRET:?API_SECRET is required}
      # Comma-separated origins allowed to call the API from a browser (camasys frontend)
      - CORS_ORIGIN=${CORS_ORIGIN:-}
      - IMAGE_TAG=${IMAGE_TAG:-latest}
      - OPENINARY_TELEMETRY=${OPENINARY_TELEMETRY:-false}
      - VIDEO_MAX_CONCURRENT=${VIDEO_MAX_CONCURRENT:-}
      - VIDEO_JOB_RETRY_MAX=${VIDEO_JOB_RETRY_MAX:-3}
      - VIDEO_JOB_CLEANUP_HOURS=${VIDEO_JOB_CLEANUP_HOURS:-24}
      - VIDEO_WORKER_POLL_INTERVAL_MS=${VIDEO_WORKER_POLL_INTERVAL_MS:-1000}
      # Keep nginx client_max_body_size at least this big
      - MAX_FILE_SIZE_MB=${MAX_FILE_SIZE_MB:-50}
      # S3-compatible storage (Cloudflare R2). Leave empty to store on the public-files volume.
      - STORAGE_REGION=${STORAGE_REGION:-auto}
      - STORAGE_ACCESS_KEY_ID=${STORAGE_ACCESS_KEY_ID:-}
      - STORAGE_SECRET_ACCESS_KEY=${STORAGE_SECRET_ACCESS_KEY:-}
      - STORAGE_BUCKET_NAME=${STORAGE_BUCKET_NAME:-}
      - STORAGE_ENDPOINT=${STORAGE_ENDPOINT:-}
      - STORAGE_PUBLIC_URL=${STORAGE_PUBLIC_URL:-}
      # Optional first-launch admin, remove from .env after the first start
      - OPENINARY_ADMIN_NAME=${OPENINARY_ADMIN_NAME:-}
      - OPENINARY_ADMIN_EMAIL=${OPENINARY_ADMIN_EMAIL:-}
      - OPENINARY_ADMIN_PASSWORD=${OPENINARY_ADMIN_PASSWORD:-}
      - OPENINARY_GENERATE_API_KEY=${OPENINARY_GENERATE_API_KEY:-false}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '${DOCKER_CPU_LIMIT:-2.0}'
          memory: ${DOCKER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${DOCKER_CPU_RESERVATION:-0.5}'
          memory: ${DOCKER_MEMORY_RESERVATION:-1G}

volumes:
  cache-data:
  public-files:
  db-data:
